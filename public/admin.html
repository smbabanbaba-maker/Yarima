<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yarima Digital · API Management</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#9aa8c7}.pill{border:1px solid #34415f;border-radius:99px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}.card{background:#141d33;border:1px solid #273653;border-radius:16px;padding:18px}h1{font-size:26px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}label{display:block;font-size:12px;color:#aebbd5;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #354463;background:#0d1528;color:white}button{border:0;border-radius:9px;background:#e8b84c;color:#171717;padding:11px 15px;font-weight:700;cursor:pointer;margin-top:12px}button.secondary{background:#263653;color:#eaf0ff}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #293753}.status{color:#8fe0b0}.error{color:#ff9c9c}.notice{margin-top:14px;white-space:pre-wrap}.hidden{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:600px){body{padding:16px}table{font-size:11px}}
</style></head><body>
<header class="top"><div><h1>Yarima Digital</h1><div class="muted">Full API Management · Admin Console</div></div><span class="pill">Owner admin: smbabanba@gmail.com</span></header>
<div id="notice" class="notice muted">Checking admin session…</div>
<section id="console" class="hidden">
<div class="grid">
<div class="card"><h2>Add API provider</h2><form id="providerForm">
<label>Provider name</label><input name="name" placeholder="e.g. N3TData" required maxlength="80">
<label>API base URL (HTTPS)</label><input name="baseUrl" type="url" placeholder="https://api.provider.com" required>
<label>Authentication type</label><select name="authType"><option value="bearer">Bearer</option><option value="token">Token</option><option value="api-key">API key</option><option value="basic">Basic</option><option value="custom">Custom</option></select>
<label>API credential / secret</label><input name="secret" type="password" required autocomplete="off">
<button type="submit">Save provider securely</button></form></div>
<div class="card"><h2>Manual service routing</h2><form id="routeForm">
<label>Service</label><select name="service"><option value="data">Data</option><option value="airtime">Airtime</option><option value="tv">Cable TV</option><option value="electricity">Electricity</option><option value="exam_pin">Exam PIN</option><option value="other">Other</option></select>
<label>Network / service code</label><input name="network" placeholder="MTN, Airtel, Glo, 9mobile" required maxlength="40">
<label>Plan type</label><input name="planType" placeholder="SME, SME2, Gifting, default" value="default">
<label>Enabled provider</label><select name="providerId" id="providerSelect" required><option value="">Add and enable a provider first</option></select>
<button type="submit">Save routing</button></form><p class="muted">Routing is manual. No automatic failover is enabled.</p></div>
</div>
<div class="card" style="margin-top:18px"><div class="row"><h2 style="margin:0">Configured providers</h2><button class="secondary" id="refresh">Refresh</button></div><div id="providers" class="muted">Loading…</div></div>
<div class="card" style="margin-top:18px"><h2>Service routing</h2><div id="routes" class="muted">Loading…</div></div>
</section>
<script>
const $=s=>document.querySelector(s),notice=$('#notice');
async function call(body){const r=await fetch('/api/admin',{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function msg(t,bad=false){notice.textContent=t;notice.className='notice '+(bad?'error':'status')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const d=await call();$('#console').classList.remove('hidden');notice.textContent='Admin session verified. Provider secrets are never displayed.';$('#providers').innerHTML=d.providers.length?'<table><thead><tr><th>Provider</th><th>Base URL</th><th>Credentials</th><th>Status</th><th>Action</th></tr></thead><tbody>'+d.providers.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.baseUrl)+'</td><td>'+(p.hasCredentials?'Stored encrypted':'Missing')+'</td><td>'+ (p.enabled?'Enabled':'Disabled')+'</td><td><button class="secondary" data-id="'+esc(p.id)+'" data-enabled="'+(!p.enabled)+'">'+(p.enabled?'Disable':'Enable')+'</button></td></tr>').join('')+'</tbody></table>':'No providers added yet.';
const enabled=d.providers.filter(p=>p.enabled);$('#providerSelect').innerHTML=enabled.length?enabled.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join(''):'<option value="">Add and enable a provider first</option>';
$('#routes').innerHTML=d.routes.length?'<table><thead><tr><th>Service</th><th>Network</th><th>Plan type</th><th>Provider ID</th><th>Status</th></tr></thead><tbody>'+d.routes.map(r=>'<tr><td>'+esc(r.service)+'</td><td>'+esc(r.network)+'</td><td>'+esc(r.plan_type)+'</td><td>'+esc(r.provider_id||'—')+'</td><td>'+(r.enabled?'Enabled':'Disabled')+'</td></tr>').join('')+'</tbody></table>':'No service routes configured.'; }catch(e){msg(e.message,true);if(e.message.includes('Sign in')||e.message.includes('Admin access'))msg(e.message+' Sign in to the customer app with the owner email first, then reopen /admin.html.',true)}}
$('#providerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await call({action:'add-provider',name:f.get('name'),baseUrl:f.get('baseUrl'),authType:f.get('authType'),secret:f.get('secret')});e.target.reset();msg('Provider saved. Credential encrypted.');await load()}catch(x){msg(x.message,true)}});
$('#routeForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await call({action:'set-route',service:f.get('service'),network:f.get('network'),planType:f.get('planType'),providerId:f.get('providerId'),enabled:true});msg('Manual route saved. Purchases remain disabled until provider adapter and transaction safety checks are implemented.');await load()}catch(x){msg(x.message,true)}});
$('#providers').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;try{await call({action:'set-provider',providerId:b.dataset.id,enabled:b.dataset.enabled==='true'});await load();msg('Provider status updated.')}catch(x){msg(x.message,true)}});
$('#refresh').addEventListener('click',load);load();
</script></body></html>
